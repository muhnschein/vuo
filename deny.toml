# cargo-deny configuration.
#
# Runs inside `make check`, not separate nightly ritual. Rationale:
# docs/scope.md §8.3; SailfishOS Rust floor constrains upgrades, so learning
# early that an advisory hits an unbumpable version beats learning at release.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Vuo is GPL-3.0-or-later: permissive dependency licences compatible. Copyleft
# deps not automatically a problem, but deliberate decision, not transitive-bump
# accident.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # Vuo's own crates. SPDX id is "-or-later" form, distinct from bare
    # "GPL-3.0"; allowing only latter rejects workspace's own members.
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
exceptions = []
# Unused allowance warns by default. List slightly wider than today's graph on
# purpose: says which licences acceptable, not which present this week.
unused-allowed-license = "allow"

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# "deny", not "warn": Makefile and §8.3 name duplicate crates as gate subject;
# "warn" never turns `make check` red. `skip` list below makes NEW duplicate
# visible: existing ones outside project control, each added deliberately.
multiple-versions = "deny"
wildcards = "deny"
# Vuo's crates depend on each other by path, no version requirement: normal in
# workspace, not supply-chain hazard `wildcards` catches.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # §9.1: TLS verification not optional, no toggle. Dependency pulling second
    # TLS stack is way for one to appear.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]
# Today's duplicates, each transitive pull nothing in Vuo chooses. Listed
# individually on purpose: NEW duplicate (introduced by our change) isn't here,
# turns `make check` red. Removing resolved entry = one line; adding one =
# deliberate note why unavoidable.
skip = [
    # rusqlite (0.15) and indexmap/others (0.16) disagree.
    "hashbrown",
    # proc-macro crates spanning syn 1 and syn 2; build-time only.
    "syn",
    # Pulled at different versions by tokio/rustls-native-certs.
    "windows-sys",
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
