# The long fuzz run (§8.3: "short in PR CI, long on a schedule").
#
# The corpus is cached between runs so each night continues where the last left
# off rather than restarting from the seeds.

name: Fuzz (nightly)

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

# The corpus cache and the crash artifacts travel on the runtime's own token,
# not on GITHUB_TOKEN, so the checkout is the only thing this workflow needs a
# token for at all.
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [content_transform, entry_deserialise]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes with git, so the token is not left behind in
          # .git/config for a later step to find.
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz

      - name: Restore corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: crates/vuo-core/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz for 30 minutes
        env:
          # See the note in ci.yml: rust-toolchain.toml pins a stable release
          # and would
          # otherwise override the nightly toolchain cargo-fuzz requires.
          RUSTUP_TOOLCHAIN: nightly
        run: |
          # cargo-fuzz defaults --target to the triple IT was built for, and
          # the prebuilt binary install-action fetches is musl-static. A
          # sanitizer cannot be linked against a static libc, so the build
          # fails with "sanitizer is incompatible with statically linked libc"
          # and, confusingly, "can't find crate for `core`". Pin the target to
          # the actual host instead of inheriting the tool's own.
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          echo "fuzzing for host target $HOST"
          # Adds any seed the restored corpus does not already contain, without
          # overwriting what previous nights minimised.
          scripts/fuzz-seed.sh ${{ matrix.target }}
          cd crates/vuo-core/fuzz
          cargo fuzz run --target "$HOST" ${{ matrix.target }} \
            -- -max_total_time=1800 -rss_limit_mb=4096 -dict=${{ matrix.target }}.dict

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/vuo-core/fuzz/artifacts/
