# Long fuzz run (§8.3: short in PR CI, long on schedule).
#
# Corpus cached between runs: each night continues from last, not from seeds.

name: Fuzz (nightly)

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

# Corpus cache and crash artifacts use runtime's own token, not GITHUB_TOKEN;
# only checkout needs a token.
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [content_transform, entry_deserialise]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing pushes with git: token not left in .git/config.
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz

      - name: Restore corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: crates/vuo-core/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz for 30 minutes
        env:
          # See ci.yml: rust-toolchain.toml would override nightly cargo-fuzz
          # needs.
          RUSTUP_TOOLCHAIN: nightly
        run: |
          # cargo-fuzz defaults --target to its own build triple; install-action
          # binary is musl-static, and sanitizer can't link static libc
          # ("sanitizer is incompatible with statically linked libc", "can't
          # find crate for `core`"). Pin host triple.
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          echo "fuzzing for host target $HOST"
          # Adds seeds missing from restored corpus; doesn't overwrite minimised
          # entries.
          scripts/fuzz-seed.sh ${{ matrix.target }}
          cd crates/vuo-core/fuzz
          cargo fuzz run --target "$HOST" ${{ matrix.target }} \
            -- -max_total_time=1800 -rss_limit_mb=4096 -dict=${{ matrix.target }}.dict

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/vuo-core/fuzz/artifacts/
