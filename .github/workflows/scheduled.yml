# What breaks with nobody pushing.
#
# ci.yml judges a change; this judges world moving under unchanged tree: new
# RustSec advisory on locked crate, lint next stable clippy adds, pinned action
# with known hole. None arrive with a commit. Leak check here because too slow
# for every push.
#
# Weekly, and by hand from Actions tab. Red run blocks nothing; it is the
# notice. Each job says what to do on failure.
name: scheduled

on:
  schedule:
    # Monday, off the hour, 20 min after Miniflux integration job: no runner
    # queue clash.
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # `make check` runs advisories too, but only on push. Red = advisory names
  # locked crate: bump it (within rust-version floor), or record why not
  # applicable in deny.toml `ignore`.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing pushes with git: token not left in .git/config. Every
          # checkout here.
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny
      - run: cargo deny check advisories

  # rust-toolchain.toml pins gate's clippy so new lint never fails PR. This
  # shows what current stable says, so bumping pin is known work. Red = next
  # bump has fixes, nothing broken.
  next-stable-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Shim and app link Qt; their clippy is most of tree.
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # rust-cache keys on toolchain file's release; job builds with
          # `+stable`.
          key: next-stable
      - run: rustc +stable --version
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings

  # scripts/leak-check.sh: every test under ASan + LSan. Red = leak (log ends in
  # LeakSanitizer report with allocation stack) or test asserting on clock ASan
  # slowed. Script says how to run one test alone.
  leak-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Same packages as ci.yml (same tests), plus llvm for llvm-symbolizer:
      # scripts/lsan.supp matches by function name, needs symbolized report.
      - name: Install Qt and llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtdeclarative5-dev-tools \
            qml-module-qtquick2 \
            llvm
      # Nightly scripts/leak-check.sh names. No rust-cache: nothing shared with
      # other jobs, week-old cache = GBs to restore for little.
      - run: rustup toolchain install nightly-2026-10-12 --profile minimal --component rust-src
      - run: scripts/leak-check.sh

  # ci.yml runs zizmor offline. Online it also asks GitHub about action
  # advisories and whether each pinned commit is on action's own repo: facts
  # that change without a commit here.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor@1.30.1
      - run: zizmor .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}
