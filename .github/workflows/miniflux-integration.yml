# Ephemeral Miniflux: check §11 contract questions against real server, not
# mock.
#
# §8.3: cursor semantics and bulk-mutation idempotency are questions about
# someone else's server; checked once by hand = found by regression on update.
#
# Distroless image:
#
#   1. No shell in container: readiness can't be curl healthcheck in service
#      definition. Runner polls health endpoint instead.
#   2. Distroless covers fewer architectures than Alpine. Fine on x86_64; check
#      before ARM.
#
# PINNING
#
# §8.3 says pin by digest, bump deliberately. Images below pinned to exact
# version tag only: no `latest` surprises, but tag can be repointed.
#
# No digests: registry unreachable where this was written, and invented sha256
# fails at pull with useless error. Before trusting this job, run:
#
#     docker manifest inspect miniflux/miniflux:2.3.3-distroless \
#       | jq -r '.manifests[0].digest'
#
# and replace each `image:` with `name@sha256:...`. check-pins step below stops
# warning once done.

name: Miniflux integration

# Scheduled and manual only (§8.3: separate scheduled or opt-in job). Depends on
# third-party registry and server Vuo doesn't control; gating PRs on it = merge
# depends on someone else's uptime. `make check` is gate; this is periodic
# contract check.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Talks only to its own Miniflux and checkout. API key belongs to throwaway
# instance, not repo: no writable token wanted.
permissions:
  contents: read

jobs:
  live:
    name: against a real Miniflux
    runs-on: ubuntu-latest

    services:
      postgres:
        # TODO(pin): replace with an @sha256: digest. See the note at the top.
        image: postgres:16-alpine
        ports:
          # Miniflux runs --network host, so reaches Postgres on runner's
          # localhost. Service without `ports:` only reachable on bridge network
          # by alias, which host-network container can't resolve: readiness poll
          # times out silently.
          - 5432:5432
        env:
          POSTGRES_USER: miniflux
          POSTGRES_DB: miniflux
          # No password, not committed password.
          #
          # SonarQube flags connection string as credential (secrets:S6698).
          # Value guards nothing (ephemeral, runner localhost), and can't be
          # randomised: `services:` start before any step. `trust` removes
          # credential instead of hiding it: local, unauthenticated access to
          # one-job database of fixtures.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U miniflux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing pushes with git: token not left in .git/config.
          persist-credentials: false

      - name: Remind about digest pinning
        # Warning, not failure: job that refuses to run until edited never gets
        # fixed. Annotation on every run harder to ignore.
        run: |
          if grep -q 'TODO(pin)' .github/workflows/miniflux-integration.yml; then
            echo "::warning file=.github/workflows/miniflux-integration.yml::Container images are pinned by tag, not by digest (§8.3 asks for digests). See the note at the top of this workflow."
          fi

      - name: Start Miniflux
        env:
          # 2.3.3 minimum: Vuo write floor is 2.3.2 (absolute `starred` in `PUT
          # /v1/entries`); starred half of bulk contract test needs it.
          # TODO(pin): replace with an @sha256: digest. See the note at the top.
          MINIFLUX_IMAGE: miniflux/miniflux:2.3.3-distroless
        run: |
          docker run -d --name miniflux --network host \
            -e DATABASE_URL="postgres://miniflux@localhost/miniflux?sslmode=disable" \
            -e RUN_MIGRATIONS=1 \
            -e CREATE_ADMIN=1 \
            -e ADMIN_USERNAME=vuo \
            -e ADMIN_PASSWORD=vuo-test-password \
            -e LISTEN_ADDR=127.0.0.1:8080 \
            -e FETCHER_ALLOW_PRIVATE_NETWORKS=1 \
            "$MINIFLUX_IMAGE"

      - name: Wait for readiness
        # Polled from runner: distroless image has no shell for healthcheck.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthcheck >/dev/null 2>&1; then
              echo "Miniflux is up after ${i}s"
              curl -fsS http://127.0.0.1:8080/version && echo
              exit 0
            fi
            sleep 1
          done
          echo "Miniflux did not become ready" >&2
          docker logs miniflux || true
          exit 1

      - name: Serve the fixture feed
        # Miniflux on --network host reaches runner's 127.0.0.1. Local feed:
        # seed deterministic, no outbound network needed.
        #
        # Needs FETCHER_ALLOW_PRIVATE_NETWORKS=1 above: since 2.3.x fetcher
        # refuses private/loopback hosts (SSRF guard); else feed creation 500s
        # with "refusing to access private network host". Fine here: ephemeral
        # instance, this URL only.
        run: |
          (cd tests/fixtures && python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8099/seed-feed.xml >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "the fixture feed server did not start" >&2
          exit 1

      - name: Create an API key and seed entries
        id: seed
        run: |
          # To file, read with jq, not piped into python3. `curl ... |
          # <interpreter>` is shape SonarQube flags (githubactions:S8482); this
          # reads data.
          curl -fsS -u vuo:vuo-test-password \
            -X POST http://127.0.0.1:8080/v1/api-keys \
            -H 'Content-Type: application/json' \
            -d '{"description":"ci"}' -o api-key.json
          token=$(jq -r '.token' api-key.json)
          rm -f api-key.json
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

          # OPML of real feeds: breadth.
          curl -fsS -X POST http://127.0.0.1:8080/v1/import \
            -H "X-Auth-Token: $token" \
            --data-binary @tests/fixtures/seed.opml || true

          # Local fixture: what contract tests rely on.
          curl -fsS -X POST http://127.0.0.1:8080/v1/feeds \
            -H "X-Auth-Token: $token" \
            -H 'Content-Type: application/json' \
            -d '{"feed_url":"http://127.0.0.1:8099/seed-feed.xml","category_id":1}'

      - name: Wait for entries to exist
        # Contract tests FAIL on empty instance, so job must wait for entries.
        # Poller needs time after import.
        env:
          TOKEN: ${{ steps.seed.outputs.token }}
        run: |
          for i in $(seq 1 60); do
            # To file, then jq. Instance still starting: failed request or
            # unparseable body = not ready yet, not job failure.
            total=0
            if curl -fsS -H "X-Auth-Token: $TOKEN" \
                'http://127.0.0.1:8080/v1/entries?limit=1' \
                -o entries.json 2>/dev/null; then
              total=$(jq -r '.total // 0' entries.json 2>/dev/null || echo 0)
            fi
            if [ "${total:-0}" -ge 3 ]; then
              echo "instance has $total entries after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "the instance never reached 3 entries; the contract tests would prove nothing" >&2
          curl -fsS -H "X-Auth-Token: $TOKEN" http://127.0.0.1:8080/v1/feeds || true
          docker logs miniflux || true
          exit 1

      # rust-toolchain.toml release; rustup installs on first use.
      - run: rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run the opt-in live tests
        env:
          VUO_LIVE_BASE_URL: http://127.0.0.1:8080
          VUO_LIVE_TOKEN: ${{ steps.seed.outputs.token }}
        # SKIP_QT=1: job installs no Qt; `live-test` is pure Rust over HTTP.
        # Makefile's qmake guard already scoped to Qt goals; explicit here so a
        # tighter guard can't silently break this job.
        run: make live-test SKIP_QT=1

      - name: Miniflux logs
        if: failure()
        run: docker logs miniflux || true
