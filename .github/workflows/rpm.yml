# Device RPM against Sailfish SDK.
#
# Not in `ci.yml`: multi-GB SDK image, whole-workspace cross-compile. Run from
# Actions tab, on tag, or on recipe PRs.
#
# SDK makes result run on phone: links target's Qt 5.6, libsailfishapp, glibc.
# Not `mb2` (as postivene's rpm.yml): Jolla repos install rust/cargo 1.75.0+git2
# into target (5.2.0.15 SDK), lockfile needs 1.88 (docs/sdk-build.md, "The
# blocker"). So SDK's cross compiler and sysroot get lifted out of image and
# driven by pinned cargo in pinned build container:
# scripts/build-in-container.sh, same as local build.
#
# Releases reproducible: `reproduce` rebuilds on other runner beside `rpm`;
# `compare` checks byte for byte before `release` publishes
# (docs/verifying.md).
#
# Kept short by: lifted SDK and cross-compiled crates cached between runs. Push
# to main builds too: caches every branch starts from (caches: own branch +
# main only) stay current, each main commit has an RPM. Releases restore no
# cache.
name: rpm

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Device architecture (scripts/cross-build.sh knows aarch64 only)
        type: choice
        options: [aarch64]
        default: aarch64
      sfos_version:
        description: >
          Sailfish SDK version to build against. Only versions with a pinned
          image digest below are accepted. The target's glibc is the floor
          the package will run on, so pick the oldest release the phone runs.
        type: string
        default: "5.2.0.15"
      release:
        description: >
          Build the package Harbour would be given: Release 1, so the file is
          harbour-vuo-VERSION-1.aarch64.rpm. Off by default, because two builds
          with the same NEVRA are indistinguishable to `pkcon install-local`
          and device testing wants each one to supersede the last.
        type: boolean
        default: false
      release_tag:
        description: >
          Publish a GitHub release at this tag, e.g. v1.0.1, creating the tag
          at the commit this run builds. Leave empty to build a package and
          release nothing. Pushing the tag does the same thing without the
          form; this exists because creating a tag is not something every
          contributor's checkout is allowed to do, while this workflow's own
          token is.
        type: string
        default: ""
      rehearse:
        description: >
          Rehearse a release on this branch: build as the release would
          (Release 1, no cache), rebuild it on a second runner and compare,
          but tag and publish nothing.
        type: boolean
        default: false
  push:
    # `v*` = release. `build-*` = throwaway handle to run before workflow
    # reaches main (workflow_dispatch needs workflow on main).
    tags: ["v*", "build-*"]
    branches: [main]
    # Docs only: nothing packaged changes. Tags ignore path filters.
    paths-ignore: ["docs/**", "*.md"]
  # Recipe change proved by running it: job builds PR head before it lands.
  pull_request:
    paths:
      - ".github/workflows/rpm.yml"
      - "scripts/build-in-container.sh"
      - "scripts/container-engine.sh"
      - "scripts/cross-build.sh"
      - "scripts/cross-rpm.sh"
      - "scripts/verify-release.sh"
      - "rpm/Containerfile"
      - "rpm/sdk-images"
      - "rpm/harbour-vuo-cross.spec"

permissions:
  contents: read

jobs:
  # Inputs checked and release decided before any build: bad tag costs seconds,
  # and `rpm`, `reproduce` start together on the answer.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      # yes: Release 1 package, no cache (release, `release` box, rehearsal).
      release_build: ${{ steps.release.outputs.release_build }}
      sdk_digest: ${{ steps.sdk.outputs.digest }}
    env:
      SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing pushes with git: token not left in .git/config.
          persist-credentials: false

      # Free text from dispatch form, spliced into paths and artifact name.
      # Digest per version: rpm/sdk-images.
      - name: Check the SDK version
        id: sdk
        run: |
          [[ $SFOS =~ ^[0-9]+(\.[0-9]+){3}$ ]] || {
            echo "::error::sfos_version '$SFOS' is not a dotted version"; exit 1; }
          digest=$(awk -v v="$SFOS" '$1 == v { print $2; exit }' rpm/sdk-images)
          [ -n "$digest" ] || {
            echo "::error::no pinned digest for $SFOS; add one to rpm/sdk-images"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Tag is free text from form, becomes git ref and `gh` arg: shape-checked,
      # read via env (not expanded into script), so tag can't be shell.
      #
      # Must match tree's Version, else release page and RPM disagree (v1.0.2
      # tag, 1.0.1 package).
      - name: Resolve the release tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_REHEARSE: ${{ inputs.rehearse }}
        run: |
          tag="${INPUT_RELEASE_TAG:-}"
          if [ -n "$tag" ]; then
            [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::release_tag '$tag' is not vMAJOR.MINOR.PATCH"; exit 1; }
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [ -n "$tag" ]; then
            spec=$(sed -n 's/^Version: *//p' rpm/harbour-vuo.spec | head -1)
            [ "$tag" = "v$spec" ] || {
              echo "::error::$tag does not match the spec's Version: $spec"; exit 1; }
            echo "this run releases $tag"
          elif [ "$INPUT_REHEARSE" = "true" ]; then
            echo "this run rehearses a release; publishes nothing"
          else
            echo "this run releases nothing; building a package only"
          fi
          if [ -n "$tag" ] || [ "$INPUT_RELEASE" = "true" ] || [ "$INPUT_REHEARSE" = "true" ]; then
            echo "release_build=yes" >> "$GITHUB_OUTPUT"
          else
            echo "release_build=no" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  rpm:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCH: ${{ inputs.arch || 'aarch64' }}
      SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
      RELEASE_BUILD: ${{ needs.plan.outputs.release_build }}
      SDK_DIGEST: ${{ needs.plan.outputs.sdk_digest }}
      # One job, every run: higher counts stall; slow finish beats restart.
      # build-in-container.sh passes it to cargo; cc crate shares cargo's
      # jobserver, so C/C++ compiles serial too. Here, not in script: local
      # build keeps every core.
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing pushes with git: token not left in .git/config.
          persist-credentials: false

      # Lifted compiler and sysroot (~2 GB), per pinned digest; key also holds
      # lift recipe. Not for release builds: they lift from pinned image, as
      # users' check does. zizmor can't read `if`, hence ignored
      # cache-poisoning finding.
      - name: Restore the lifted SDK
        id: sdk-cache
        if: env.RELEASE_BUILD != 'yes'  # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vuo-sdk
          key: sdk-${{ env.SFOS }}-${{ env.SDK_DIGEST }}-${{ hashFiles('scripts/build-in-container.sh') }}

      # SDK image ~13 GB unpacked, until compiler and sysroot lifted out. Lifted
      # SDK from cache: no pull, no room needed.
      - name: Make room
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h / | tail -1

      # Not for release: cache written by earlier run, release binary must come
      # from tagged commit only; pays cold compile. zizmor can't read the `if`,
      # hence ignored cache-poisoning finding. Container writes crates to
      # ~/.cargo (VUO_CARGO_HOME below) and objects to target/, as runner user:
      # where this caches.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2  # zizmor: ignore[cache-poisoning]
        if: env.RELEASE_BUILD != 'yes'
        with:
          key: cross-SailfishOS-${{ env.SFOS }}-${{ env.ARCH }}

      # Test builds: run number as Release, else same NEVRA every time and `pkcon
      # install-local` silently does nothing. Run number monotonic: each build
      # supersedes last.
      #
      # Release build keeps Release: 1 (Harbour naming:
      # harbour-NAME-VERSION-RELEASE.ARCHITECTURE.rpm, no CI run number). Tags
      # are releases; dispatch form asks; rehearsal builds one too. RELEASE
      # allows only digits, underscores, periods: test artifact identified by
      # short SHA in ARTIFACT name.
      - name: Stamp the build so each one is its own package
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          if [ "$RELEASE_BUILD" = "yes" ]; then
            echo "VUO_RELEASE=1"     >> "$GITHUB_ENV"
            echo "building a RELEASE package (Release: 1)"
          else
            echo "VUO_RELEASE=1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "building a TEST package (Release: 1.${GITHUB_RUN_NUMBER})"
          fi

      # Same script as local build and as `reproduce`, so they can't drift (its
      # comments say why). Docker here; `reproduce` rebuilds with Podman.
      # Stall hangs, never fails: cut off here, not at job's 120 min.
      - name: Build the RPM
        timeout-minutes: 60
        env:
          VUO_ENGINE: docker
        run: VUO_SDK_CACHE=~/.cache/vuo-sdk VUO_CARGO_HOME=~/.cargo scripts/build-in-container.sh "$SFOS"

      # Harbour file-name rule, set by stamping above, so
      # scripts/check-harbour.sh can't hold it:
      # harbour-NAME-VERSION-RELEASE.ARCHITECTURE.rpm, ≤ 100 chars, VERSION
      # digits and periods, RELEASE digits/underscores/periods, ARCHITECTURE one
      # of four.
      - name: Harbour's file-name rule
        run: |
          f=$(basename dist/*.rpm)
          echo "$f"
          [ ${#f} -le 100 ] || {
            echo "::error::the file name is ${#f} characters; Harbour allows 100"; exit 1; }
          [[ $f =~ ^harbour-[a-z0-9][a-z0-9._-]{2,49}-[0-9]+(\.[0-9]+){0,2}-[0-9._]+\.(aarch64|armv7hl|i486|noarch)\.rpm$ ]] || {
            echo "::error::$f is not harbour-NAME-VERSION-RELEASE.ARCH.rpm"; exit 1; }
          if [ "$RELEASE_BUILD" = "yes" ]; then
            case "$f" in
              *-1.$ARCH.rpm) echo "release package: $f" ;;
              *) echo "::error::a release package must have Release 1, got $f"; exit 1 ;;
            esac
          fi
          sha256sum dist/*.rpm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harbour-vuo-${{ env.ARCH }}-sfos${{ env.SFOS }}-${{ env.SHORT_SHA }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30

      # After upload, deliberately: allowed-libraries rule only device link
      # answers, and breaking package still installs and runs, so you want it in
      # hand to debug. Artifact kept, job red, nothing released. Host readelf
      # reads aarch64 ELF too.
      - name: Harbour's allowed-libraries rule
        run: ./scripts/check-linked-libs.sh target/aarch64-unknown-linux-gnu/release/harbour-vuo

  # Release rebuilt the way docs/verifying.md tells users (verify-release.sh):
  # fresh clone, other runner, Podman not Docker, other time zone and umask.
  # Beside `rpm`, not after: needs that package only to compare (`compare`).
  # Both cold: release takes one build's time, not two.
  reproduce:
    needs: plan
    if: needs.plan.outputs.release_tag != '' || inputs.rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Make room
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"

      # SDK image's build user is uid 100000, past rootless Podman's default
      # 65536 subordinate ids. The step docs/verifying.md gives users.
      # Range clear of runner's own (165536+): overlap = "write to uid_map
      # failed".
      - name: Give rootless Podman the SDK image's ids
        run: |
          sudo usermod --add-subuids 1000000-1999999 --add-subgids 1000000-1999999 "$(id -un)"
          podman system migrate

      # Stall cut off, as in `rpm`.
      - name: Rebuild from a fresh clone
        timeout-minutes: 60
        run: |
          umask 0027
          mkdir -p reproduced
          TZ=Pacific/Kiritimati scripts/verify-release.sh --podman \
            --ref "$GITHUB_SHA" --no-download --save reproduced/reproduced.rpm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproduced
          path: reproduced/reproduced.rpm
          if-no-files-found: error
          retention-days: 30

  # Package against rebuild, verify-release.sh's own comparison: byte for byte,
  # else what differs inside. Not byte-identical: no release. Own job: holds no
  # write.
  compare:
    needs: [rpm, reproduce]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fetch both packages
        run: |
          gh run download "$GITHUB_RUN_ID" --dir rpms --pattern 'harbour-vuo-*'
          gh run download "$GITHUB_RUN_ID" --dir rpms --name reproduced

      - name: Compare
        run: |
          scripts/verify-release.sh --docker --ref "$GITHUB_SHA" --no-download \
            --rpm rpms/*/harbour-vuo-*.rpm --rebuilt rpms/reproduced.rpm

  # Publishes only what `reproduce` rebuilt byte for byte (`compare`). Release
  # notes from spec's %changelog; SHA256SUMS beside package.
  release:
    needs: [plan, rpm, compare]
    if: needs.plan.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
      ARCH: ${{ inputs.arch || 'aarch64' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fetch the package the rpm job built
        run: |
          gh run download "$GITHUB_RUN_ID" --dir rpms --pattern 'harbour-vuo-*'
          mkdir dist
          mv rpms/*/harbour-vuo-*.rpm dist/
          (cd dist && sha256sum -- *.rpm > SHA256SUMS && cat SHA256SUMS)

      # `gh`, not third-party action: runner ships it, no tag to repoint,
      # nothing to pin.
      - name: Publish the release
        run: |
          notes=$(mktemp)
          {
            echo "Device package for SailfishOS ${SFOS} and later, ${ARCH}."
            echo
            echo 'Install it with `pkcon install-local harbour-vuo-*.rpm`, or'
            echo 'through Storeman if you have it.'
            echo
            echo 'Rebuilds from this tag to the same file, byte for byte:'
            echo 'see docs/verifying.md.'
            echo
            echo "## Changes"
            echo
            # Spec's %changelog is changelog; top entry = this release. Read
            # from there, no second copy to disagree.
            awk '
              /^%changelog/ { in_cl = 1; next }
              !in_cl        { next }
              /^\* /        { if (++seen > 1) exit; next }
                            { print }
            ' rpm/harbour-vuo.spec
          } > "$notes"
          cat "$notes"

          # Idempotent: re-run after transient failure attaches package, no
          # "release already exists".
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.rpm dist/SHA256SUMS --clobber
          else
            # --target creates tag when form asked; on tag push tag already this
            # commit's, gh ignores it.
            gh release create "$RELEASE_TAG" dist/*.rpm dist/SHA256SUMS \
              --title "Vuo $RELEASE_TAG" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA"
          fi
