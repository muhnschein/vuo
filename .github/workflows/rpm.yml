# Device RPM against Sailfish SDK.
#
# Not in `ci.yml`: multi-GB SDK image, whole-workspace cross-compile. Run from
# Actions tab, on tag, or on recipe PRs.
#
# SDK makes result run on phone: links target's Qt 5.6, libsailfishapp, glibc.
# Not `mb2` (as postivene's rpm.yml): Jolla repos install rust/cargo 1.75.0+git2
# into target (5.2.0.15 SDK), lockfile needs 1.88 (docs/sdk-build.md, "The
# blocker"). So SDK's cross compiler and sysroot get lifted out of image and
# driven by host cargo: scripts/cross-build.sh, scripts/cross-rpm.sh.
name: rpm

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Device architecture (scripts/cross-build.sh knows aarch64 only)
        type: choice
        options: [aarch64]
        default: aarch64
      sfos_version:
        description: >
          Sailfish SDK version to build against. Only versions with a pinned
          image digest below are accepted. The target's glibc is the floor
          the package will run on, so pick the oldest release the phone runs.
        type: string
        default: "5.2.0.15"
      release:
        description: >
          Build the package Harbour would be given: Release 1, so the file is
          harbour-vuo-VERSION-1.aarch64.rpm. Off by default, because two builds
          with the same NEVRA are indistinguishable to `pkcon install-local`
          and device testing wants each one to supersede the last.
        type: boolean
        default: false
      release_tag:
        description: >
          Publish a GitHub release at this tag, e.g. v1.0.1, creating the tag
          at the commit this run builds. Leave empty to build a package and
          release nothing. Pushing the tag does the same thing without the
          form; this exists because creating a tag is not something every
          contributor's checkout is allowed to do, while this workflow's own
          token is.
        type: string
        default: ""
  push:
    # `v*` = release. `build-*` = throwaway handle to run before workflow
    # reaches main (workflow_dispatch needs workflow on main).
    tags: ["v*", "build-*"]
  # Recipe change proved by running it: job builds PR head before it lands.
  pull_request:
    paths:
      - ".github/workflows/rpm.yml"
      - "scripts/cross-build.sh"
      - "scripts/cross-rpm.sh"
      - "rpm/harbour-vuo-cross.spec"

permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Write for release publish step only. Read floor stays on workflow above:
    # non-tag builds keep read-only token.
    permissions:
      contents: write
    env:
      ARCH: ${{ inputs.arch || 'aarch64' }}
      SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
      ROOTFS: /home/runner/sdk/rootfs
      # One job, every run: higher counts stall; slow finish beats restart.
      # Cargo reads it in scripts/cross-build.sh; cc crate shares cargo's
      # jobserver, so C/C++ compiles serial too. Here, not in script: local
      # cross build keeps every core.
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Release publishes via `gh` and GH_TOKEN, not git: token not left in
          # .git/config.
          persist-credentials: false

      # By digest, not tag: third-party image, tag repointable. New SDK version:
      # `docker manifest inspect coderus/sailfishos-platform-sdk:<ver>`, add
      # line.
      #
      # Version shape-checked first: free text from dispatch form, spliced into
      # paths and artifact name.
      - name: Resolve the SDK image
        run: |
          [[ $SFOS =~ ^[0-9]+(\.[0-9]+){3}$ ]] || {
            echo "::error::sfos_version '$SFOS' is not a dotted version"; exit 1; }
          case "$SFOS" in
            5.2.0.15) digest=sha256:e7c4379393b17ee63d7f7443ce9930c315a61fdb2e732016346ccbe8c934435e ;;
            5.1.0.11) digest=sha256:31ba115546972af3630f4690acc204a4e09701358ae39be1883ca70e0eadda86 ;;
            5.0.0.43) digest=sha256:0eb5e0cbcdc7e5f12280d8d05c198f8497e7b39679fb6009f30b8a720b02a53a ;;
            *) echo "::error::no pinned digest for coderus/sailfishos-platform-sdk:$SFOS; add one to rpm.yml"
               exit 1 ;;
          esac
          echo "IMAGE=coderus/sailfishos-platform-sdk@$digest" >> "$GITHUB_ENV"
          echo "TARGET=SailfishOS-$SFOS-$ARCH" >> "$GITHUB_ENV"

      # Release decided before build: bad tag costs seconds, not whole build.
      #
      # Tag is free text from form, becomes git ref and `gh` arg: shape-checked,
      # read via env (not expanded into script), so tag can't be shell.
      #
      # Must match tree's Version, else release page and RPM disagree (v1.0.2
      # tag, 1.0.1 package).
      - name: Resolve the release tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${INPUT_RELEASE_TAG:-}"
          if [ -n "$tag" ]; then
            [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::release_tag '$tag' is not vMAJOR.MINOR.PATCH"; exit 1; }
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [ -n "$tag" ]; then
            spec=$(sed -n 's/^Version: *//p' rpm/harbour-vuo.spec | head -1)
            [ "$tag" = "v$spec" ] || {
              echo "::error::$tag does not match the spec's Version: $spec"; exit 1; }
            echo "this run releases $tag"
          else
            echo "this run releases nothing; building a package only"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      # ~13 GB unpacked; hosted runner has room, and image removed after lift
      # below.
      - name: Pull the Sailfish SDK
        run: |
          df -h / | tail -1
          docker pull "$IMAGE"

      # What scripts/cross-build.sh needs from image, nothing else:
      #
      #   /opt/cross                  SDK's aarch64-meego-linux-gnu GCC; must match
      #                               device glibc and libstdc++ (docs/sdk-build.md)
      #   /srv/mer/targets/<target>   target sysroot: Qt 5.6, sailfishapp, glibc,
      #                               everything link resolves
      #   a few of /usr/lib's         tooling's i486 libmpc/libmpfr/libgmp etc.;
      #   libraries                   cc1 links them, host lacks them
      #
      # `docker cp`, not 13 GB export; image removed after. Target name checked
      # against image's own list first: naming change fails here, not deep in
      # build.
      - name: Lift the cross toolchain and sysroot out of the image
        run: |
          targets=$(docker run --rm "$IMAGE" sb2-config -l 2>/dev/null || true)
          echo "available targets:"; echo "$targets"
          echo "$targets" | grep -qx -- "$TARGET" || {
            echo "::error::no $TARGET in the $SFOS SDK image; see the list above"; exit 1; }

          # Image has no default command and `docker create` needs one;
          # container never starts, any command works.
          c=$(docker create "$IMAGE" true)
          mkdir -p "$ROOTFS/opt" "$ROOTFS/srv/mer/targets" "$ROOTFS/usr"
          # `docker cp` from container extracts in client process; runner user
          # can't restore root ownership ("operation not permitted"). sudo, then
          # chown back.
          sudo docker cp "$c:/opt/cross" "$ROOTFS/opt/cross"
          sudo docker cp "$c:/srv/mer/targets/$TARGET" "$ROOTFS/srv/mer/targets/$TARGET"
          docker rm "$c" >/dev/null

          # Not all of tooling's /usr/lib: `docker cp` refuses trees with
          # symlinks pointing outside. Image's own ldd lists libs cross compiler
          # loads; copy exactly those, dereferenced. Skip glibc: host i386 libc
          # serves; foreign libc on LD_LIBRARY_PATH breaks every 32-bit program
          # on runner.
          mkdir -p "$ROOTFS/usr/lib"
          docker run --rm --user root -v "$ROOTFS/usr/lib:/out" "$IMAGE" sh -c '
            set -e
            libexec=/opt/cross/libexec/gcc/aarch64-meego-linux-gnu
            for b in $libexec/*/cc1 $libexec/*/cc1plus $libexec/*/collect2 $libexec/*/lto1 \
                     $libexec/*/lto-wrapper /opt/cross/bin/aarch64-meego-linux-gnu-*; do
              [ -x "$b" ] || continue
              ldd "$b" 2>/dev/null | awk "/=> \\//{print \$3}"
            done | sort -u | while read -r lib; do
              case "$lib" in
                /usr/lib/*) cp -L "$lib" /out/ ;;
              esac
            done
            ls -l /out
            ls /out/libmpc.so* /out/libmpfr.so* /out/libgmp.so* >/dev/null'
          docker rmi "$IMAGE" >/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$ROOTFS"
          # GCC resolves cc1 and specs against absolute prefix: toolchain must
          # be at /opt/cross.
          sudo ln -sfn "$ROOTFS/opt/cross" /opt/cross
          du -sh "$ROOTFS"/opt/cross "$ROOTFS"/srv/mer/targets/* "$ROOTFS"/usr/lib
          df -h / | tail -1
          ls "$ROOTFS/opt/cross/bin" | grep -- "-gcc$"

      # Cross compilers are i386 ELFs (docs/sdk-build.md). rpm packages on host;
      # qemu runs target's own lrelease, since newer Qt's .qm not guaranteed
      # readable by device's 5.6.
      - name: Install host prerequisites
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6:i386 libstdc++6:i386 zlib1g:i386 \
            rpm qemu-user-static file binutils

      # Host cargo, new enough for lockfile, prebuilt aarch64 std. Only C/C++
      # compiles and final link use SDK compiler; rustc is rust-toolchain.toml's
      # release.
      - run: rustup target add aarch64-unknown-linux-gnu

      # Not for release: cache written by earlier run, release binary must come
      # from tagged commit only; pays cold compile. zizmor can't read the `if`,
      # hence ignored cache-poisoning finding.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2  # zizmor: ignore[cache-poisoning]
        if: env.RELEASE_TAG == '' && !inputs.release
        with:
          key: cross-${{ env.TARGET }}

      # Test builds: run number as Release, else same NEVRA every time and `pkcon
      # install-local` silently does nothing. Run number monotonic: each build
      # supersedes last.
      #
      # Release build keeps Release: 1 (Harbour naming:
      # harbour-NAME-VERSION-RELEASE.ARCHITECTURE.rpm, no CI run number). Tags
      # are releases; dispatch form asks. RELEASE allows only digits,
      # underscores, periods: test artifact identified by short SHA in ARTIFACT
      # name.
      - name: Stamp the build so each one is its own package
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          if [ "${{ inputs.release }}" = "true" ] || [ -n "$RELEASE_TAG" ]; then
            echo "VUO_RELEASE=1"     >> "$GITHUB_ENV"
            echo "RELEASE_BUILD=yes" >> "$GITHUB_ENV"
            echo "building a RELEASE package (Release: 1)"
          else
            echo "VUO_RELEASE=1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "RELEASE_BUILD=no"  >> "$GITHUB_ENV"
            echo "building a TEST package (Release: 1.${GITHUB_RUN_NUMBER})"
          fi

      # scripts/cross-rpm.sh runs scripts/cross-build.sh, then %install/%files
      # half of spec as rpm/harbour-vuo-cross.spec over cross-built binary.
      # Output = TEST package.
      - name: Cross-build and package
        env:
          SDK_VERSION: ${{ env.SFOS }}
        run: scripts/cross-rpm.sh "$ROOTFS"

      - name: Show what was built
        run: |
          for f in dist/*.rpm; do
            echo "== $f"; rpm -qip "$f"; rpm -qlp "$f"
          done

      # Harbour file-name rule, set by stamping above, so
      # scripts/check-harbour.sh can't hold it:
      # harbour-NAME-VERSION-RELEASE.ARCHITECTURE.rpm, ≤ 100 chars, VERSION
      # digits and periods, RELEASE digits/underscores/periods, ARCHITECTURE one
      # of four.
      - name: Harbour's file-name rule
        run: |
          f=$(basename dist/*.rpm)
          echo "$f"
          [ ${#f} -le 100 ] || {
            echo "::error::the file name is ${#f} characters; Harbour allows 100"; exit 1; }
          [[ $f =~ ^harbour-[a-z0-9][a-z0-9._-]{2,49}-[0-9]+(\.[0-9]+){0,2}-[0-9._]+\.(aarch64|armv7hl|i486|noarch)\.rpm$ ]] || {
            echo "::error::$f is not harbour-NAME-VERSION-RELEASE.ARCH.rpm"; exit 1; }
          if [ "$RELEASE_BUILD" = "yes" ]; then
            case "$f" in
              *-1.$ARCH.rpm) echo "release package: $f" ;;
              *) echo "::error::a release package must have Release 1, got $f"; exit 1 ;;
            esac
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harbour-vuo-${{ env.ARCH }}-sfos${{ env.SFOS }}-${{ env.SHORT_SHA }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30

      # After upload, deliberately: allowed-libraries rule only device link
      # answers, and breaking package still installs and runs, so you want it in
      # hand to debug. Artifact kept, job red.
      - name: Harbour's allowed-libraries rule
        run: |
          bin=target/aarch64-unknown-linux-gnu/release/harbour-vuo
          readelf=/opt/cross/bin/aarch64-meego-linux-gnu-readelf
          ./scripts/check-linked-libs.sh "$bin" "$readelf"

      # Run with release tag publishes, package attached (pushed tag or form).
      #
      # Last: after both Harbour rules, so breaking package never reaches
      # release page; failed job never gets here.
      #
      # `gh`, not third-party action: runner ships it, no tag to repoint,
      # nothing to pin.
      - name: Publish the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          {
            echo "Device package for SailfishOS ${SFOS} and later, ${ARCH}."
            echo
            echo 'Install it with `pkcon install-local harbour-vuo-*.rpm`, or'
            echo 'through Storeman if you have it.'
            echo
            echo "## Changes"
            echo
            # Spec's %changelog is changelog; top entry = this release. Read
            # from there, no second copy to disagree.
            awk '
              /^%changelog/ { in_cl = 1; next }
              !in_cl        { next }
              /^\* /        { if (++seen > 1) exit; next }
                            { print }
            ' rpm/harbour-vuo.spec
          } > "$notes"
          cat "$notes"

          # Idempotent: re-run after transient failure attaches package, no
          # "release already exists".
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.rpm --clobber
          else
            # --target creates tag when form asked; on tag push tag already this
            # commit's, gh ignores it.
            gh release create "$RELEASE_TAG" dist/*.rpm \
              --title "Vuo $RELEASE_TAG" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA"
          fi
