# The host CI gate.
#
# §8: "`make check` runs exactly what CI runs, from a clean checkout, with no
# phone, no server account, and no network." This workflow is therefore
# deliberately thin: it installs dependencies and calls `make check`. If a
# contributor's local `make check` passes, this passes.
#
# Device RPM builds need the SailfishOS SDK, which does not run on stock
# runners, so they stay local or on OBS (§8.1).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes. Every job checks out, builds and reports through the
# check run the Actions runtime raises on its own; none of them touch the
# contents, issues or pull-request APIs. Saying so pins the floor, so a step
# added later cannot quietly inherit a token that can push.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A phone build has no incremental cache either, and this keeps CI closer to
  # what the device build does.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: host checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes with git, so the token is not left behind in
          # .git/config for a later step to find. Every checkout in this file.
          persist-credentials: false

      - name: Install Qt and packaging tools
        run: |
          sudo apt-get update
          # The -dev packages omit the QtQuick runtime plugin, which is a
          # confusing failure if missed (§8.1): QML compiles but nothing can
          # instantiate a QtQuick item.
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtdeclarative5-dev-tools \
            qml-module-qtquick2 \
            desktop-file-utils

      # The toolchain is rust-toolchain.toml's: rustup installs the pinned
      # release, with rustfmt and clippy, the first time cargo runs. No
      # action, so there is no pin to keep on someone else's branch.
      - run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny

      # For `make check`'s workflow-lint, which reads these workflows offline.
      # scheduled.yml runs the same version online.
      - name: Install zizmor
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor@1.30.1

      - name: make check
        run: make check

      # Needs crates.io, so it is not part of `make check` (docs/scope.md §8).
      # What it guards is a Harbour rule: third_party/qmetaobject is what keeps
      # QtWidgets out of the binary. See docs/packaging.md.
      - name: make vendor-check
        run: make vendor-check

  msrv:
    name: SailfishOS Rust floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # §7: the SDK ships an older Rust than current stable. This job exists so
      # a dependency bump cannot silently break the device build -- the failure
      # mode it prevents is discovering it during a release.
      - name: Read the pinned MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workspace rust-version is $version"

      # Through the environment, not spliced into the script: a `${{ }}` in
      # `run:` is pasted in as shell text before the shell reads it, and this
      # one is whatever Cargo.toml says.
      - name: Install the floor
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo check on the floor
        # `cargo +VERSION`, NOT a bare `cargo`. rust-toolchain.toml pins a
        # stable release, and a rustup toolchain FILE overrides the
        # toolchain this job installs -- so the bare `cargo check` that used to
        # be here ran on stable every single time. The job installed the MSRV,
        # ignored it, and reported success; the device build was meanwhile
        # impossible. Verified by reproducing it: with 1.75 as the rustup
        # default, `cargo --version` in this repo still answers 1.94.
        #
        # --locked: the committed lockfile is what OBS builds offline, so the
        # check has to apply to those exact versions.
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          cargo "+$MSRV" --version
          cargo "+$MSRV" check \
            --workspace --exclude vuo-shim --exclude harbour-vuo --locked --all-targets

  fuzz-smoke:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz
      # §8.3: "Run short in PR CI, long on a schedule." These two targets are
      # the code paths that eat attacker-influenced bytes.
      - name: Fuzz the content transform and the JSON deserialiser
        env:
          # rust-toolchain.toml pins a stable release for everyone, which
          # OVERRIDES the nightly installed above -- so cargo-fuzz's
          # -Zsanitizer was being handed to a stable rustc and rejected.
          # RUSTUP_TOOLCHAIN takes precedence over the toolchain file.
          RUSTUP_TOOLCHAIN: nightly
        run: |
          # cargo-fuzz defaults --target to the triple IT was built for, and
          # the prebuilt binary install-action fetches is musl-static. A
          # sanitizer cannot be linked against a static libc, so the build
          # fails with "sanitizer is incompatible with statically linked libc"
          # and, confusingly, "can't find crate for `core`". Pin the target to
          # the actual host instead of inheriting the tool's own.
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          echo "fuzzing for host target $HOST"
          # fuzz/corpus/ is gitignored, so without this every run starts from
          # an empty corpus -- and from empty, 60 seconds never reaches the
          # assertions these targets exist for. See scripts/fuzz-seed.sh.
          scripts/fuzz-seed.sh content_transform entry_deserialise
          cd crates/vuo-core/fuzz
          for target in content_transform entry_deserialise; do
            cargo fuzz run --target "$HOST" "$target" \
              -- -max_total_time=60 -rss_limit_mb=4096 -dict="$target.dict"
          done

