# Host CI gate.
#
# §8: `make check` = exactly what CI runs, clean checkout, no phone, no server
# account, no network. So workflow stays thin: install deps, call `make check`.
# Local `make check` green → this green.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# New push supersedes in-flight run. Fallback `github.ref`, not `run_id`:
# head_ref is PR-only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Nothing here writes; no job touches contents, issues or PR APIs. Pins floor so
# later step can't inherit token that can push.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Phone build has no incremental cache either; keeps CI close to device build.
  CARGO_INCREMENTAL: 0

jobs:
  # Docs-only PR (`*.md` outside vendor/, third_party/): jobs below skipped. Job
  # skipped by `if:` passes as required check. Rules: scripts/changes.sh.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Merge commit and its base parent.
          fetch-depth: 2
      - id: diff
        run: scripts/changes.sh >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

  check:
    name: host checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing pushes with git: token not left in .git/config. Every
          # checkout here.
          persist-credentials: false

      # -dev packages omit QtQuick runtime plugin (§8.1): QML compiles but
      # nothing can instantiate QtQuick item. Script: slow or broken mirror
      # costs minutes, not job.
      - name: Install Qt and packaging tools
        run: >-
          scripts/apt-install.sh --no-install-recommends
          qtbase5-dev qtdeclarative5-dev qtdeclarative5-dev-tools
          qml-module-qtquick2 desktop-file-utils

      # Toolchain from rust-toolchain.toml: rustup installs pinned release with
      # rustfmt and clippy on first cargo run. No action, no pin to keep.
      - run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny

      # For `make check` workflow-lint (offline). scheduled.yml runs same
      # version online.
      - name: Install zizmor
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor@1.30.1

      - name: make check
        run: make check

      # Needs crates.io, so not in `make check` (docs/scope.md §8). Guards
      # Harbour rule: third_party/qmetaobject keeps QtWidgets out of binary. See
      # docs/packaging.md.
      - name: make vendor-check
        run: make vendor-check

  msrv:
    name: SailfishOS Rust floor
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # §7: SDK ships older Rust than stable. Job stops dependency bump silently
      # breaking device build.
      - name: Read the pinned MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workspace rust-version is $version"

      # Via env, not spliced into script: `${{ }}` in `run:` becomes shell text,
      # and value comes from Cargo.toml.
      - name: Install the floor
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo check on the floor
        # `cargo +VERSION`, not bare `cargo`: rust-toolchain.toml overrides
        # toolchain this job installs, so bare `cargo check` runs stable.
        #
        # --locked: OBS builds committed lockfile offline; check those exact
        # versions.
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          cargo "+$MSRV" --version
          cargo "+$MSRV" check \
            --workspace --exclude vuo-shim --exclude harbour-vuo --locked --all-targets

  fuzz-smoke:
    name: fuzz (short)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz
      # §8.3: short in PR CI, long on schedule. These two targets eat
      # attacker-influenced bytes.
      - name: Fuzz the content transform and the JSON deserialiser
        env:
          # rust-toolchain.toml overrides nightly installed above; stable rustc
          # rejects cargo-fuzz's -Zsanitizer. RUSTUP_TOOLCHAIN beats toolchain
          # file.
          RUSTUP_TOOLCHAIN: nightly
        run: |
          # cargo-fuzz defaults --target to its own build triple; install-action
          # binary is musl-static, and sanitizer can't link static libc
          # ("sanitizer is incompatible with statically linked libc", "can't
          # find crate for `core`"). Pin host triple.
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          echo "fuzzing for host target $HOST"
          # fuzz/corpus/ gitignored: without seeds, 60 s from empty never
          # reaches the assertions. See scripts/fuzz-seed.sh.
          scripts/fuzz-seed.sh content_transform entry_deserialise
          cd crates/vuo-core/fuzz
          for target in content_transform entry_deserialise; do
            cargo fuzz run --target "$HOST" "$target" \
              -- -max_total_time=60 -rss_limit_mb=4096 -dict="$target.dict"
          done

