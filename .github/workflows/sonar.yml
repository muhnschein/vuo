# SonarQube Cloud analysis.
#
# Out of ci.yml on purpose. ci.yml = GATE (`make check`; §8: green local `make
# check` = green CI). This = REPORT: can't fail a change; its quality gate is
# advice. Folding in would make hosted service part of the gate.
#
# Both inputs (clippy diagnostics, coverage) come from `make sonar-reports`:
# runnable at home. Why scanner doesn't make them: sonar-project.properties.

name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Nothing writes. SonarQube Cloud decorates PRs via its own GitHub App.
permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Docs-only PR (`*.md` outside vendor/, third_party/): no scan, as ci.yml.
  # Markdown has no rules here but secrets; GitHub's secret scanning reads it
  # anyway. Rules: scripts/changes.sh.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # Merge commit and its base parent.
          fetch-depth: 2
      - id: diff
        run: scripts/changes.sh >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

  sonar:
    name: SonarQube Cloud
    needs: changes
    runs-on: ubuntu-latest
    # Hung step stops here, not at GitHub's 6 h.
    timeout-minutes: 30
    # Fork PRs get no secrets: empty SONAR_TOKEN, auth failure that looks like
    # broken setup. Skip; merge analysed when branch reaches main.
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Sonar reads git blame for new code. Shallow clone = every line looks
          # new.
          fetch-depth: 0
          # Nothing pushes with git: token not left in .git/config; scan holds
          # SONAR_TOKEN.
          persist-credentials: false

      # Same as ci.yml: -dev packages omit QtQuick runtime plugin; shim tests
      # instantiate QtQuick items.
      - name: Install Qt
        run: >-
          scripts/apt-install.sh --no-install-recommends
          qtbase5-dev qtdeclarative5-dev qtdeclarative5-dev-tools
          qml-module-qtquick2

      # Every action pinned to full commit SHA, version beside it. Tag is
      # movable by owner or attacker (tj-actions/changed-files, CVE-2025-30066);
      # SHA isn't. SonarQube S7637 flags unpinned form; job holds SONAR_TOKEN.
      #
      # Toolchain from rust-toolchain.toml (rustup, clippy on first use); only
      # adds coverage tooling. No toolchain action: its `stable` branch is
      # rebuilt each release, leaving pinned commits on no branch or tag.
      - run: rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov

      - name: make sonar-reports
        run: make sonar-reports

      # One version, in Cargo.toml. scripts/check-packaging.sh fails spec drift;
      # this keeps SonarQube from being third copy.
      - name: Read the workspace version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "analysing version $version"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # SONAR_HOST_URL unset = SonarQube Cloud; only self-hosted needs it.
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}

      # Scan uploads and exits; server processes later. Without this, gate,
      # ratings, issues stay on dashboard, out of job log.
      #
      # continue-on-error, never `sonar.qualitygate.wait`: reports, doesn't
      # gate. Sonar outage = warning, not failed build.
      - name: What SonarQube made of it
        if: always()
        continue-on-error: true
        env:
          # Only needed if project private; endpoints public otherwise. See
          # script.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: scripts/sonar-report.sh
