[workspace]
# Resolver 2, must stay: SDK cargo 1.75 rejects whole manifest on `resolver =
# "3"` ("valid options are 1 or 2").
#
# Loss: resolver 3 would keep lockfile inside `rust-version`. Without it lock
# drifts past what SDK builds (edition2024 deps cargo 1.75 can't parse). Floor
# held by `scripts/check-lockfile.sh` (`make check`) instead.
#
# Plus .cargo/config.toml: gives resolver 2 the one resolver 3 behaviour that
# matters, `cargo update` prefers newest release building on `rust-version`.
# Cargo ≥ 1.84 reads it; SDK's 1.75 ignores it.
resolver = "2"
members = ["crates/vuo-core", "crates/vuo-shim", "crates/harbour-vuo"]

# vuo-shim and harbour-vuo link Qt, build only with Qt dev headers. Default
# members = Qt-free set, so root `cargo build` works on bare runner. Build
# others with `-p vuo-shim` / `-p harbour-vuo` (see `make shim`).
default-members = ["crates/vuo-core"]

[workspace.package]
version = "1.1.1"
edition = "2021"
# Floor the dependency graph actually needs, measured: `url` → `idna` → `icu_*`
# declare 1.88. Every crate pins it; `make msrv` and CI msrv job check it.
#
# SDK tooling ships 1.75 (5.0.0.43): too old, and edition2024 deps don't parse
# there. So device build uses a newer Rust (docs/packaging.md, docs/status.md).
# Don't lower this number to match SDK; it was never true.
rust-version = "1.88"
license = "GPL-3.0-or-later"
# Not for crates.io. Also lets cargo-deny `allow-wildcard-paths` apply (it skips
# publishable crates): Vuo's crates depend on each other by path on purpose.
publish = false
repository = "https://github.com/muhnschein/vuo"
authors = ["Vuo contributors"]

[workspace.lints.rust]
# Denied here, not via `RUSTFLAGS: -D warnings`: RUSTFLAGS reaches path deps,
# which cargo doesn't cap, so `third_party/qmetaobject` warnings became errors.
# Lints table applies only to crates that opt in.
#
# Crates not inheriting this table (vuo-shim, harbour-vuo: need `unsafe_code`
# allowed) set `warnings = "deny"` themselves.
warnings = "deny"
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
# Redundant paths and same-type casts: noise hiding casts that matter. Not
# `trivial_numeric_casts`: `x as c_char` trivial depends on target (i8 on x86_64
# CI, u8 on phone); could pass CI, fail device build.
unused_qualifications = "deny"
trivial_casts = "deny"
# Every public item says what it is for, as in piirit.
# `clippy::missing_errors_doc` (pedantic) asks same of every fallible fn.
missing_docs = "deny"

[workspace.lints.clippy]
# Whole pedantic group, as piirit: mostly what reviewer would ask anyway, and
# new lints arrive via next-stable-clippy job. Exceptions allowed where they
# occur, reason beside them.
pedantic = { level = "deny", priority = -1 }
# Two allowed, both about function length: hits were test scenarios and sync
# worker's event loop, clearer read top to bottom.
too_many_lines = "allow"
items_after_statements = "allow"
# Foreign input comes from arbitrary websites via Miniflux. Panic not safe:
# unwinding into Qt's C++ frames is UB. See docs/scope.md §9.5.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "warn"
todo = "deny"
unimplemented = "deny"
# Picked from nursery and restriction, not whole groups: those move between
# releases, much is taste. Each here = bug class or lost diagnosis.
#
# Lock guard living through `if let`/`match` body: Qt callback and sync worker
# deadlock.
significant_drop_in_scrutinee = "deny"
redundant_clone = "deny"
needless_collect = "deny"
derive_partial_eq_without_eq = "deny"
# `assert!(r.is_ok())` fails without the error.
assertions_on_result_states = "deny"
# `.map_err(|_| ...)` drops cause; on phone often all there is. Where cause
# could quote a secret, name fault kind instead (see `load_account`).
map_err_ignore = "deny"
mem_forget = "deny"
# Debugging leftovers.
dbg_macro = "deny"
print_stdout = "deny"
# Rest of panic-freedom set (`arithmetic_side_effects`, `string_slice`,
# `let_underscore_must_use`, ...) is shipped-code only, which this table can't
# say. Each crate root denies them under `cfg_attr(not(test), ...)`.

# qmetaobject builds QML engine on `QApplication` (QtWidgets). Harbour disallows
# QtWidgets; Silica apps use `QGuiApplication`. Upstream has no feature to turn it
# off, so we carry the crate.
#
# `third_party/qmetaobject` = upstream 0.2.10 + `third_party/qmetaobject.patch`
# (three lines: include, member type, constructor). `make vendor-check` proves
# exactly that. Approach from postivene.
[patch.crates-io]
qmetaobject = { path = "third_party/qmetaobject" }

[profile.release]
# Device build size-sensitive.
#
# `s` not `z`, for battery: `z` also disables loop vectorisation, and hot paths
# are bursts vectorisation helps (html5ever over article bodies, serde_json over
# 250-entry page, base64 over icons, SQLite C). Finishing sooner and idling uses
# less energy. `s` keeps size discipline without that cut.
#
# Host x86_64 release harbour-vuo: 4,675,696 bytes at `z`, 4,803,632 at `s` (125
# KB, 2.7%). Reconsider only against measured sync-path CPU time, not size
# alone.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
