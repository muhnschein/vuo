[workspace]
# Resolver 2, and it has to stay 2: the SDK's cargo 1.75 rejects the whole
# workspace manifest on `resolver = "3"` ("valid options are 1 or 2").
#
# That is a real loss -- resolver 3 is what keeps a lockfile inside
# `rust-version` automatically. The workaround, when a dependency bump is
# needed: set this to "3", run `cargo update`, set it back to "2", and keep the
# lockfile. Resolver 3 filters on `rust-version` only, so crates that use newer
# APIs without declaring one still need pinning by hand -- currently rusqlite
# (0.32 uses c"" literals, 1.77+), async-compression (0.4.26+ pulls
# compression-codecs, 1.83+) and wiremock (0.6.5 is edition2024).
#
# `scripts/check-lockfile.sh` is what catches the drift.
resolver = "2"
members = ["crates/vuo-core", "crates/vuo-shim", "crates/harbour-vuo"]

# vuo-shim and harbour-vuo link against Qt and only build where Qt development
# headers are present. `cargo build` at the workspace root would therefore fail
# on a bare CI runner, so the default members are the Qt-free set. Build them
# explicitly with `-p vuo-shim` / `-p harbour-vuo` (see `make shim`).
default-members = ["crates/vuo-core"]

# Forked dependencies. NOT workspace members: cargo auto-promotes in-workspace
# path dependencies to members, which would sweep third-party code into
# `make msrv`, check-lockfile.sh and this workspace's lints (unsafe_code =
# "deny" would fail immediately). See PATCHES.md for what was changed and why.
exclude = ["third_party/qmetaobject", "third_party/qttypes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The Rust the SailfishOS SDK ships, and therefore the only floor that matters:
# a package that will not build on the device toolchain is not a package.
#
# Holding it is not automatic. The graph had drifted to needing 1.88 -- `url` ->
# `idna` -> `icu_*` -- with nineteen dependencies on edition2024, which cargo
# 1.75 cannot even parse, and vendoring parses every manifest. Getting back
# here meant an MSRV-aware re-resolve plus three manual pins for crates that use
# newer APIs without declaring a `rust-version` (see below).
#
# It went unnoticed because the CI job guarding it installed the MSRV toolchain
# and then ran a bare `cargo`, which `rust-toolchain.toml` redirected to stable
# every time. That is fixed; `make lockfile` and the MSRV job now both bite.
rust-version = "1.75"
license = "GPL-3.0-or-later"
# Not destined for crates.io. This also lets cargo-deny's `allow-wildcard-paths`
# apply: the option deliberately does not cover publishable crates, because
# crates.io rejects path dependencies -- but Vuo's crates depend on each other
# by path on purpose and are not the supply-chain hazard `wildcards` catches.
publish = false
repository = "https://github.com/muhnschein/vuo"
authors = ["Vuo contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
# Foreign input reaches this program from arbitrary websites by way of a
# Miniflux instance. Panicking on it is not a safe failure mode: unwinding out
# of Rust into Qt's C++ frames is undefined behaviour. See docs/scope.md §9.5.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "warn"
todo = "deny"
unimplemented = "deny"

[profile.release]
# The device build is size-sensitive; a phone does not need 16 codegen units'
# worth of parallel compilation more than it needs a smaller binary.
opt-level = "z"
# Fat LTO by default for host/desktop builds. The DEVICE build overrides this
# to "off" from the spec: cpp_build compiles the sailfishapp C++ glue with
# -fno-lto, and rustc cannot LTO objects that carry no bitcode.
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Two upstream crates are forked to keep libQt5Widgets.so.5 out of the binary.
#
# Harbour's allowed_libraries.conf does not list it, and rpmvalidation.sh fails
# twice over -- "Cannot link to shared library" and "Cannot require shared
# library" -- so a qmetaobject app cannot reach the store unpatched. qttypes
# called link_lib("Widgets") unconditionally, and qmetaobject's QmlEngine glue
# built a QtWidgets QApplication.
#
# Both patches are needed together: dropping the link alone fails with
# undefined QApplication::QApplication and QApplication::exec(), and changing
# only the glue leaves -lQt5Widgets on the link line, where its absence from
# DT_NEEDED would depend on --as-needed holding under sb2.
#
# Versions must stay exactly 0.2.10 / 0.2.12 -- the qmetaobject dependency is
# pinned with "=" and these are what the lockfile and the offline registry
# have. PATCHES.md records the diff so the fork can be re-applied on a bump.
[patch.crates-io]
qmetaobject = { path = "third_party/qmetaobject" }
qttypes = { path = "third_party/qttypes" }
