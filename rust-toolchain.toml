# Pinned: every contributor and CI runner compiles Vuo same way.
#
# NOT MSRV. SailfishOS SDK ships older Rust (see `rust-version` in workspace
# Cargo.toml, `make msrv`); device build uses SDK toolchain. Pin keeps rustfmt
# and clippy identical everywhere: clippy drift turns `-D warnings` into
# lottery.
#
# Exact release, not `stable` (moves under runners when new Rust ships, fails
# unchanged PRs). .github/workflows/scheduled.yml `next-stable-clippy` job
# reports next stable weekly: bump is known work. Bump deliberately with fixes
# it lists.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
