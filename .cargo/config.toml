# Resolve deps for workspace `rust-version` floor, not for whatever cargo runs.
#
# Resolver 2 ignores `rust-version` when picking versions: `cargo update` takes
# newest of everything, msrv job first to notice. This prefers newest release
# that builds on floor (resolver 3 default). Resolver 3 not an option: SDK cargo
# 1.75 rejects whole manifest (see Cargo.toml). Cargo < 1.84 ignores this key.
[resolver]
incompatible-rust-versions = "fallback"
# Vendored OBS build replaces this file with its source replacement
# (rpm/harbour-vuo.spec, `cp %SOURCE2`). Build is `--locked`: resolves nothing.
