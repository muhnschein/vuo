# SonarQube Cloud analysis parameters.
#
# The scan runs from .github/workflows/sonar.yml. It is a REPORT, not a gate:
# `make check` and ci.yml decide what is allowed in, and nothing here can turn
# a red build green or a green build red. Keeping that boundary matters --
# §8's rule is that CI runs what `make check` runs, and a second opinion that
# no one can reproduce on a laptop is not a check.
#
# Two of the Rust inputs are produced by `make sonar-reports` rather than by
# the scanner itself. The reasons are with the properties, at the bottom.

sonar.projectKey=muhnschein_vuo
sonar.organization=muhnschein
sonar.projectName=Vuo

# sonar.projectVersion is deliberately NOT set here. The workspace version
# lives in Cargo.toml, and scripts/check-packaging.sh already fails a build
# where rpm/harbour-vuo.spec has drifted from it. A third copy would be a
# third thing to forget at release time, so the workflow reads Cargo.toml and
# passes -Dsonar.projectVersion on the command line.

sonar.sourceEncoding=UTF-8

# The whole tree, minus the exclusions below, rather than a list of source
# directories: the secrets detector runs over files no language analyser
# claims -- the spec file, the desktop entry, the shell scripts under
# scripts/ -- and those are exactly the files a token gets pasted into.
sonar.sources=.

# Test code, separated so that coverage and duplication are measured on the
# application and not on its fixtures.
#
# This catches less than it looks like it does: Rust's unit tests live in
# `#[cfg(test)]` modules INSIDE the files they test, and there is no moving
# them. What it does catch is the integration tests, the fuzz targets and the
# Silica doubles -- which is where near-identical code is supposed to live.
#
# A file may not be in both sets, so every path here appears in
# sonar.exclusions as well. The scanner's complaint when it does not is
# "File X can't be indexed twice".
sonar.tests=crates/vuo-core/tests,crates/vuo-shim/tests,crates/vuo-core/fuzz/fuzz_targets,qml-stubs

sonar.exclusions=\
    third_party/**,\
    **/target/**,\
    vendor/**,\
    translations/**,\
    store/**,\
    icons/**,\
    crates/vuo-core/tests/**,\
    crates/vuo-shim/tests/**,\
    crates/vuo-core/fuzz/**,\
    qml-stubs/**,\
    **/*.png,\
    **/*.sqlite

# Binary fixtures live inside the test tree, and sonar.exclusions does not
# reach it -- that list governs main sources only.
sonar.test.exclusions=\
    **/*.png,\
    **/*.sqlite

# third_party/qmetaobject is a vendored upstream fork carrying exactly one
# patch of ours (see scripts/check-vendored.sh). Its defects are upstream's,
# and reporting them here would bury Vuo's own under forty-six warnings that
# nobody in this repository may fix.
#
# translations/ is generated by lupdate; store/ and icons/ are rendered
# artefacts. None of the three is written by hand.
#
# The two extensions are binaries no analyser can read: the texture masks in
# qml/art/ and the SQLite schema fixtures the migration tests open. Indexed,
# each one costs a scan and prints "Invalid character encountered ... for
# encoding UTF-8" on every run -- five lines of warning that mean nothing and
# train the reader to skim the log.

# --- Rust ---------------------------------------------------------------
#
# The Sonar Rust analyser can run Clippy itself, and that is switched off
# because it would run a DIFFERENT clippy from the one that gates the project.
# It invokes cargo at the workspace root, where `vuo-shim` and `harbour-vuo`
# cannot compile at all without Qt development headers, and it knows nothing
# about the --exclude lists the Makefile uses to keep the Qt-free crates
# buildable on a bare runner. `make sonar-reports` runs the same three clippy
# invocations `make check` runs and hands the result over as JSON.
#
# Sonar's own Rust rules are unaffected by this: it disables the external
# Clippy pass, not the analyser.
sonar.rust.clippy.enabled=false
sonar.rust.clippy.reportPaths=target/sonar/clippy.json

# Coverage, from `cargo llvm-cov`, also written by `make sonar-reports`.
# Absent reports are a warning in the scanner log, not a failure, so a run
# that skipped them degrades to "no coverage data" rather than breaking.
sonar.rust.lcov.reportPaths=target/sonar/lcov.info
