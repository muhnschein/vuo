# SonarQube Cloud analysis parameters.
#
# Scan runs from .github/workflows/sonar.yml. REPORT, not gate: `make check` and
# ci.yml decide what gets in; nothing here flips build colour. Boundary matters:
# §8 says CI runs what `make check` runs; unreproducible second opinion isn't a
# check.
#
# Two Rust inputs made by `make sonar-reports`, not scanner. Reasons at bottom
# with properties.

sonar.projectKey=muhnschein_vuo
sonar.organization=muhnschein
sonar.projectName=Vuo

# sonar.projectVersion NOT set here on purpose. Version lives in Cargo.toml;
# scripts/check-packaging.sh fails rpm/harbour-vuo.spec drift. Third copy =
# third thing to forget at release; workflow reads Cargo.toml, passes
# -Dsonar.projectVersion.

sonar.sourceEncoding=UTF-8

# Whole tree minus exclusions, not source dir list: secrets detector runs over
# files no language analyser claims (spec, desktop entry, scripts/ shell), where
# tokens get pasted.
sonar.sources=.

# Test code separate: coverage and duplication measured on app, not fixtures.
#
# Catches less than it looks: Rust unit tests live in `#[cfg(test)]` modules
# INSIDE tested files, immovable. Catches integration tests, fuzz targets,
# Silica doubles (where near-identical code belongs).
#
# File can't be in both sets: every path here also in sonar.exclusions, else
# "File X can't be indexed twice".
sonar.tests=crates/vuo-core/tests,crates/vuo-shim/tests,crates/vuo-core/fuzz/fuzz_targets,qml-stubs

sonar.exclusions=\
    third_party/**,\
    **/target/**,\
    vendor/**,\
    translations/**,\
    store/**,\
    icons/**,\
    crates/vuo-core/tests/**,\
    crates/vuo-shim/tests/**,\
    crates/vuo-core/fuzz/**,\
    qml-stubs/**,\
    **/*.png,\
    **/*.sqlite

# Binary fixtures live in test tree; sonar.exclusions governs main sources only.
sonar.test.exclusions=\
    **/*.png,\
    **/*.sqlite

# third_party/qmetaobject = vendored upstream fork with one patch of ours (see
# scripts/check-vendored.sh). Defects upstream's; reporting buries Vuo's under
# forty-six warnings nobody here may fix.
#
# translations/ generated by lupdate; store/ and icons/ rendered. None
# hand-written.
#
# Two extensions = binaries no analyser reads: qml/art/ texture masks, migration
# tests' SQLite schema fixtures. Indexed, each costs scan + "Invalid character
# encountered ... for encoding UTF-8" every run: noise training reader to skim.

# Coverage measured on app, not build tools.
#
# scripts/*.py = two dev utilities: PNG mask reducer (`make textart`) and
# schema-fixture generator (never auto-run). Neither ships nor runs in `make
# check`; no Python coverage report (LCOV below = `cargo llvm-cov`, Rust only).
#
# In scope they count coverable, never covered: one-line edit fails gate at 0%
# new code coverage, saying nothing about change. Wanted Python lane → honest
# fix sonar.python.coverage.reportPaths + real suite, not this line.
sonar.coverage.exclusions=scripts/*.py

# --- Rust ---------------------------------------------------------------
#
# Sonar Rust analyser can run Clippy itself; off because it would be DIFFERENT
# clippy from project gate. Invokes cargo at workspace root, where `vuo-shim`
# and `harbour-vuo` can't compile without Qt headers; ignores Makefile --exclude
# lists keeping Qt-free crates buildable on bare runner. `make sonar-reports`
# runs same three clippy invocations as `make check`, hands result as JSON.
#
# Sonar's own Rust rules unaffected: disables external Clippy pass, not
# analyser.
sonar.rust.clippy.enabled=false
sonar.rust.clippy.reportPaths=target/sonar/clippy.json

# Coverage from `cargo llvm-cov`, also by `make sonar-reports`. Absent report =
# scanner log warning, not failure: degrades to "no coverage data".
sonar.rust.lcov.reportPaths=target/sonar/lcov.info

# --- Findings decided against -------------------------------------------
#
# Here, not sonarcloud.io: "won't fix" per issue there, invisible from tree.
sonar.issue.ignore.multicriteria=aptlists

# http:// in scripts/apt-install-selftest.sh: stand-in apt lists, never
# fetched, shaped like runner's. Ubuntu archive is plain http; apt checks signed
# Release.
sonar.issue.ignore.multicriteria.aptlists.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.aptlists.resourceKey=scripts/apt-install-selftest.sh
