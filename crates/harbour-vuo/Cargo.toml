[package]
name = "harbour-vuo"
description = "The Vuo application binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "harbour-vuo"
path = "src/main.rs"

# §9.5 (no unwinding into Qt's C++ frames, UB) applies MOST to crates touching
# Qt. `unsafe_code` allowed here (qmetaobject macros need it, reviewed line by
# line); panic denials stay. Not `[lints] workspace = true`: needs `unsafe_code`
# allowed, workspace denies it. `warnings` restated, not via `RUSTFLAGS`
# (vendored qmetaobject can't take that). See workspace manifest.
[lints.rust]
warnings = "deny"
# Workspace table says why each.
unused_qualifications = "deny"
trivial_casts = "deny"
missing_docs = "deny"

[lints.clippy]
# Workspace table says why each.
pedantic = { level = "deny", priority = -1 }
too_many_lines = "allow"
items_after_statements = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
# Workspace table says why each; crate root denies the rest.
significant_drop_in_scrutinee = "deny"
redundant_clone = "deny"
needless_collect = "deny"
derive_partial_eq_without_eq = "deny"
assertions_on_result_states = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
dbg_macro = "deny"
print_stdout = "deny"

[dependencies]
vuo-core = { path = "../vuo-core" }
vuo-shim = { path = "../vuo-shim" }
qmetaobject = "=0.2.10"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

# `cpp!` macro for main.rs SailfishApp glue. `qmetaobject` re-exports it only
# privately, so device build names it itself (see main.rs). Optional, pulled in
# by `sailfishapp`: host build needs no C++ toolchain.
cpp = { version = "0.5", optional = true }

[build-dependencies]
cpp_build = { version = "0.5", optional = true }

[features]
# Default = DESKTOP harness: plain QmlEngine, no SDK, runs on dev machine and CI
# against Silica stubs. Bring-up and debugging, not shipping.
default = []

# Device build. SailfishApp::application()/createView() for correct Wayland,
# booster, theme; QmlEngine's QtWidgets QApplication wrong for Silica. Needs
# sailfishapp headers: SDK only. rpm/harbour-vuo.spec passes it.
sailfishapp = ["dep:cpp", "dep:cpp_build"]
