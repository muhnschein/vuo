[package]
name = "harbour-vuo"
description = "The Vuo application binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "harbour-vuo"
path = "src/main.rs"

# §9.5's rule is about unwinding into Qt's C++ frames, which is undefined
# behaviour -- so it applies MOST to the crates that actually touch Qt, not
# least. `unsafe_code` stays allowed here (qmetaobject's macros require it and
# it is reviewed line by line); the panic denials do not.
# Not `[lints] workspace = true`: this crate needs `unsafe_code` allowed, and
# the workspace table denies it. `warnings` is restated instead of inherited --
# it used to come from `RUSTFLAGS` in CI, which the vendored qmetaobject can no
# longer tolerate. See the workspace manifest.
[lints.rust]
warnings = "deny"
# The workspace table says why each of these three is here.
unused_qualifications = "deny"
trivial_casts = "deny"
missing_docs = "deny"

[lints.clippy]
# See the workspace table, for these three.
pedantic = { level = "deny", priority = -1 }
too_many_lines = "allow"
items_after_statements = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
# The workspace table says why each of these is here, and that the crate
# root denies the rest.
significant_drop_in_scrutinee = "deny"
redundant_clone = "deny"
needless_collect = "deny"
derive_partial_eq_without_eq = "deny"
assertions_on_result_states = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
dbg_macro = "deny"
print_stdout = "deny"

[dependencies]
vuo-core = { path = "../vuo-core" }
vuo-shim = { path = "../vuo-shim" }
qmetaobject = "=0.2.10"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

# The `cpp!` macro that writes main.rs's SailfishApp glue. `qmetaobject`
# depends on this crate but re-exports the macro only privately, so the device
# build has to name it itself -- see the note in main.rs. Optional and pulled
# in by `sailfishapp`, so a host build still needs no C++ toolchain.
cpp = { version = "0.5", optional = true }

[build-dependencies]
cpp_build = { version = "0.5", optional = true }

[features]
# Default is the DESKTOP harness: a plain QmlEngine, which needs no SailfishOS
# SDK and therefore compiles and runs on a developer's machine (and in CI)
# against the Silica stubs. It is for bring-up and debugging, not for shipping.
default = []

# The device build. Uses SailfishApp::application()/createView() for correct
# Wayland, booster and theme setup -- QmlEngine's QtWidgets QApplication is
# wrong for a Silica app. Requires sailfishapp headers, so it only builds
# inside the SDK; rpm/harbour-vuo.spec passes it.
sailfishapp = ["dep:cpp", "dep:cpp_build"]
