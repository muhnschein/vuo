[package]
name = "vuo-shim"
description = "qmetaobject-rs adapters exposing vuo-core to QML. Requires Qt development headers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

# Not in workspace `default-members` on purpose: links Qt; `cargo build` without
# Qt headers would fail through no fault of code. `make check` builds it only
# when qmake present; `make shim` builds explicitly.

# §9.5 rule = unwinding into Qt C++ frames is UB: applies MOST to crates
# touching Qt. `unsafe_code` allowed (qmetaobject macros need it; reviewed line
# by line); panic denials stay. Not `[lints] workspace = true`: workspace denies
# `unsafe_code`. `warnings` restated, not via `RUSTFLAGS` (vendored qmetaobject
# can't tolerate it). See workspace manifest.
[lints.rust]
warnings = "deny"
# Workspace table says why each of these three.
unused_qualifications = "deny"
trivial_casts = "deny"
missing_docs = "deny"

[lints.clippy]
# See workspace table for these three.
pedantic = { level = "deny", priority = -1 }
too_many_lines = "allow"
items_after_statements = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
# Workspace table says why each; crate root denies rest.
significant_drop_in_scrutinee = "deny"
redundant_clone = "deny"
needless_collect = "deny"
derive_partial_eq_without_eq = "deny"
assertions_on_result_states = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
dbg_macro = "deny"
print_stdout = "deny"

[dependencies]
vuo-core = { path = "../vuo-core" }

# Pinned exactly. qmetaobject passively maintained upstream (§4: budget for
# carrying a patch or two): accidental minor bump = risk. 0.2.10's
# listmodel/future/qtdeclarative sources byte-identical to crate's master.
qmetaobject = "=0.2.10"
qttypes = "=0.2.12"
# `qml_register_type` wants &'static CStr. Sailfish's Rust floor predates
# C-string literals (`c"..."`): macro earns place.
cstr = "0.2"
# Favicons reach QML as `data:` URIs, decoded by Qt's network stack. Few lines
# of base64 replace QQuickImageProvider (C++ glue, second thread-affinity story,
# cache to invalidate).
base64 = "0.22"

tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
# Only for UPDATE storing scraped article content; shim otherwise no SQL.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
# Only to read cover masks back in `qml_cover.rs`; already in tree.
flate2 = "1"
