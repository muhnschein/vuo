[package]
name = "vuo-core"
description = "Miniflux sync engine, local mirror and content transform for Vuo. No Qt, no SailfishOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# --- serialisation -----------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- HTTP --------------------------------------------------------------------
# default-features = false: drops native-tls (OpenSSL) and default redirect
# policy. §9.1 wants rustls and restrictive hand-written redirect policy.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "stream",
    "gzip",
] }
http = "1"
url = { version = "2.5", features = ["serde"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# --- async -------------------------------------------------------------------
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

# --- storage -----------------------------------------------------------------
# "bundled": SQLite from vendored C, not device's. Mirror (UI's source of truth)
# behaves same in host tests and on phone. "functions": for Vuo's one SQL
# function, search matcher (src/search.rs says why search runs inside query).
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }

# --- content transform -------------------------------------------------------
# Only html5ever TOKENIZER, never tree builder or RcDom: RcDom drops
# recursively, deep nesting overflows stack on drop (§9.2). Blocks built from
# token stream with explicit depth-capped stack.
html5ever = "0.27"
tendril = "0.4"

# --- misc --------------------------------------------------------------------
thiserror = "1.0"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
tracing = "0.1"
percent-encoding = "2.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
insta = { version = "1", features = ["json", "redactions"] }
tempfile = "3"
serde_json = "1.0"

[features]
default = []
# Opt-in live integration test against real Miniflux. See docs/testing.md; also
# gated on VUO_LIVE_BASE_URL.
live-integration-tests = []
